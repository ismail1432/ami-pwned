# On a version tag (vX.Y.Z): test, build and package the extension in CI,
# then publish a GitHub Release with the zip attached.
# The zip is a release asset only — it is never committed to the repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json and manifest.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          MANIFEST="v$(node -p "require('./public/manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ] || [ "$GITHUB_REF_NAME" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package.json ($PKG) and manifest.json ($MANIFEST)."
            exit 1
          fi

      - run: npm test

      # Builds (incl. typecheck) and writes release/ami-pwned-<version>.zip
      - run: npm run package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/ami-pwned-*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
