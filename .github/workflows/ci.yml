# On every pull request and push to main: run the unit tests, typecheck and build.
# No network test here: the HIBP contract test stays opt-in (npm run test:contract).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # Builds (incl. typecheck) the two Vite bundles into dist/
      - run: npm run build
